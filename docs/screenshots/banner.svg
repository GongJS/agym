<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070914"/>
      <stop offset="55%" stop-color="#0b0d1e"/>
      <stop offset="100%" stop-color="#06121b"/>
    </linearGradient>

    <radialGradient id="glow-violet" cx="0.22" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="#663af3" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#663af3" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-teal" cx="0.82" cy="0.35" r="0.42">
      <stop offset="0%" stop-color="#269684" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#269684" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="icon-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11152b"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>

    <linearGradient id="icon-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6d9fc"/>
      <stop offset="50%" stop-color="#8b6eff"/>
      <stop offset="100%" stop-color="#269684"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#bad7f7" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="outer-clip">
      <rect x="1" y="1" width="1198" height="338" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outer-clip)">
    <!-- Canvas & ambient glows -->
    <rect x="0" y="0" width="1200" height="340" fill="url(#bg-grad)"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#glow-violet)"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#glow-teal)"/>

    <!-- Left App Icon Container -->
    <g transform="translate(56, 102)">
      <rect x="0" y="0" width="136" height="136" rx="30" fill="url(#icon-bg)" stroke="#bad7f7" stroke-opacity="0.18" stroke-width="1.5"/>
      <!-- Soft radial glow behind hexagon mark -->
      <circle cx="68" cy="68" r="44" fill="#663af3" fill-opacity="0.16"/>
      <!-- Three concentric hexagons mark -->
      <g transform="translate(68, 68)" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="0,-42 36.37,-21 36.37,21 0,42 -36.37,21 -36.37,-21" stroke="url(#icon-glow)" stroke-width="5.5" fill="none"/>
        <polygon points="0,-26.5 22.95,-13.25 22.95,13.25 0,26.5 -22.95,13.25 -22.95,-13.25" stroke="#d8ecf8" stroke-width="4.2" fill="none" transform="rotate(4)"/>
        <polygon points="0,-13 11.26,-6.5 11.26,6.5 0,13 -11.26,6.5 -11.26,-6.5" stroke="#b6d9fc" stroke-width="3.2" fill="none"/>
      </g>
    </g>

    <!-- Title + Version & Stack Pills -->
    <g transform="translate(226, 108)">
      <text x="0" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.2">agym</text>

      <!-- Version pill -->
      <g transform="translate(154, 10)">
        <rect x="0" y="0" width="76" height="28" rx="14" fill="#663af3" fill-opacity="0.24" stroke="#8b6eff" stroke-opacity="0.45" stroke-width="1"/>
        <text x="38" y="18.5" text-anchor="middle" fill="#d8ecf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">v0.2.4</text>
      </g>

      <!-- Pure-Go pill -->
      <g transform="translate(242, 10)">
        <rect x="0" y="0" width="124" height="28" rx="14" fill="#269684" fill-opacity="0.20" stroke="#269684" stroke-opacity="0.55" stroke-width="1"/>
        <text x="62" y="18.5" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">pure-go · mygo</text>
      </g>

      <!-- Subtitle -->
      <text x="0" y="84" fill="#c7d3ea" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="18.5" font-weight="400">Multi-Account &amp; Context Window Manager for Antigravity (agy)</text>

      <!-- Feature Pills Row -->
      <g transform="translate(0, 112)">
        <!-- Pill 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="144" height="34" rx="17" fill="#663af3" fill-opacity="0.14" stroke="#8b6eff" stroke-opacity="0.38" stroke-width="1"/>
          <circle cx="18" cy="17" r="4" fill="#8b6eff"/>
          <text x="30" y="21.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="13" font-weight="500">Keychain Switch</text>
        </g>

        <!-- Pill 2 -->
        <g transform="translate(156, 0)">
          <rect x="0" y="0" width="134" height="34" rx="17" fill="#269684" fill-opacity="0.14" stroke="#269684" stroke-opacity="0.45" stroke-width="1"/>
          <circle cx="18" cy="17" r="4" fill="#34d399"/>
          <text x="30" y="21.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="13" font-weight="500">Quota Monitor</text>
        </g>

        <!-- Pill 3 -->
        <g transform="translate(302, 0)">
          <rect x="0" y="0" width="120" height="34" rx="17" fill="#027dea" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.42" stroke-width="1"/>
          <circle cx="18" cy="17" r="4" fill="#60a5fa"/>
          <text x="30" y="21.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="13" font-weight="500">Auto-Rotate</text>
        </g>

        <!-- Pill 4 -->
        <g transform="translate(434, 0)">
          <rect x="0" y="0" width="138" height="34" rx="17" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.40" stroke-width="1"/>
          <circle cx="18" cy="17" r="4" fill="#fbbf24"/>
          <text x="30" y="21.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="13" font-weight="500">Context Matrix</text>
        </g>
      </g>
    </g>

    <!-- Right Floating UI Preview Card -->
    <g transform="translate(866, 36)">
      <rect x="0" y="0" width="286" height="268" rx="16" fill="#0b0e1d" fill-opacity="0.92" stroke="#bad7f7" stroke-opacity="0.16" stroke-width="1.2"/>

      <!-- Card Header -->
      <circle cx="20" cy="24" r="4.5" fill="#269684"/>
      <text x="33" y="28" fill="#d8ecf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">primary@gmail.com</text>
      <rect x="230" y="13" width="40" height="20" rx="10" fill="#663af3" fill-opacity="0.24"/>
      <text x="250" y="26.5" text-anchor="middle" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="10.5" font-weight="600">Pro</text>

      <line x1="16" y1="44" x2="270" y2="44" stroke="#bad7f7" stroke-opacity="0.10" stroke-width="1"/>

      <!-- Quota Block -->
      <g transform="translate(16, 56)">
        <rect x="0" y="0" width="254" height="94" rx="10" fill="#bad6f7" fill-opacity="0.04" stroke="#bad7f7" stroke-opacity="0.10" stroke-width="1"/>
        <!-- Accent left bar -->
        <rect x="0" y="6" width="3" height="82" rx="1.5" fill="#663af3"/>

        <!-- Gemini row -->
        <text x="14" y="22" fill="#d1e4fa" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11.5" font-weight="600">Gemini · 5h</text>
        <text x="240" y="22" text-anchor="end" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">85%</text>
        <rect x="14" y="30" width="226" height="5" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
        <rect x="14" y="30" width="192" height="5" rx="2.5" fill="#269684"/>

        <!-- Claude row -->
        <text x="14" y="62" fill="#d1e4fa" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11.5" font-weight="600">Claude · GPT · 5h</text>
        <text x="240" y="62" text-anchor="end" fill="#b6d9fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">62%</text>
        <rect x="14" y="70" width="226" height="5" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
        <rect x="14" y="70" width="140" height="5" rx="2.5" fill="#027dea"/>
      </g>

      <!-- Project Context Block -->
      <g transform="translate(16, 162)">
        <rect x="0" y="0" width="254" height="90" rx="10" fill="#bad6f7" fill-opacity="0.04" stroke="#bad7f7" stroke-opacity="0.10" stroke-width="1"/>
        <rect x="0" y="6" width="3" height="78" rx="1.5" fill="#269684"/>

        <text x="14" y="22" fill="#d8ecf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">agym · Running</text>
        <text x="240" y="22" text-anchor="end" fill="#9da7ba" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">34.1K / 1.0M</text>

        <!-- 14x2 Mini Dot Matrix -->
        <g transform="translate(14, 34)">
          <!-- Row 1: fresh (3), cache (8), output (2), empty (1) -->
          <rect x="0"   y="0" width="12" height="10" rx="2.5" fill="#b6d9fc"/>
          <rect x="16"  y="0" width="12" height="10" rx="2.5" fill="#b6d9fc"/>
          <rect x="32"  y="0" width="12" height="10" rx="2.5" fill="#b6d9fc"/>
          <rect x="48"  y="0" width="12" height="10" rx="2.5" fill="#027dea"/>
          <rect x="64"  y="0" width="12" height="10" rx="2.5" fill="#027dea"/>
          <rect x="80"  y="0" width="12" height="10" rx="2.5" fill="#027dea"/>
          <rect x="96"  y="0" width="12" height="10" rx="2.5" fill="#027dea"/>
          <rect x="112" y="0" width="12" height="10" rx="2.5" fill="#027dea"/>
          <rect x="128" y="0" width="12" height="10" rx="2.5" fill="#027dea"/>
          <rect x="144" y="0" width="12" height="10" rx="2.5" fill="#027dea"/>
          <rect x="160" y="0" width="12" height="10" rx="2.5" fill="#027dea"/>
          <rect x="176" y="0" width="12" height="10" rx="2.5" fill="#269684"/>
          <rect x="192" y="0" width="12" height="10" rx="2.5" fill="#269684"/>
          <rect x="208" y="0" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>

          <!-- Row 2: empty track -->
          <rect x="0"   y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="16"  y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="32"  y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="48"  y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="64"  y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="80"  y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="96"  y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="112" y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="128" y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="144" y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="160" y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="176" y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="192" y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
          <rect x="208" y="15" width="12" height="10" rx="2.5" fill="#bad7f7" fill-opacity="0.12"/>
        </g>

        <text x="14" y="76" fill="#9da7ba" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="10">12 steps · 3.4% used · gemini-4-hydrogen</text>
      </g>
    </g>
  </g>

  <!-- Outer hairline border -->
  <rect x="1" y="1" width="1198" height="338" rx="22" stroke="#bad7f7" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>
